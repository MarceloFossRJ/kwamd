name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run python scripts/check_specs.py
      - run: scripts/check_gitignore.sh
      - run: uv run python scripts/check_plugin.py
      # Claude Code's own validator for the marketplace, plugin and skill (no login needed).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y @anthropic-ai/claude-code@2.1.323 plugin validate .
      - run: npx -y @anthropic-ai/claude-code@2.1.323 plugin validate plugins/kwamd
