# Install once per clone: `uv run pre-commit install`
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Feature work lands on a branch and reaches main through a PR.
      - id: no-commit-to-branch
        args: [--branch, main]

  # The same commands CI runs (.github/workflows/ci.yml).
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        types: [python]
        pass_filenames: false
      - id: check-specs
        name: docs/specs conventions
        entry: uv run python scripts/check_specs.py
        language: system
        files: ^(docs/specs/|docs/agents/triage-labels\.md$|scripts/check_specs\.py$)
        pass_filenames: false
      - id: test-pdf-reads
        name: tests read PDF text through the helpers
        entry: scripts/check_test_pdf_reads.sh
        language: system
        files: ^(tests/.*\.py|scripts/check_test_pdf_reads\.sh)$
        pass_filenames: false
      # Secret and log files must stay ignored.
      - id: gitignore-guards
        name: .gitignore keeps secrets ignored
        entry: scripts/check_gitignore.sh
        language: system
        files: ^(\.gitignore|scripts/check_gitignore\.sh)$
        pass_filenames: false
